<style>*,*::before,*::after{box-sizing:border-box}html{-webkit-text-size-adjust:100%}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>AM Motors PDI Yard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">

<style>
/* Layout: sticky control header (brand, tabs, filters) over one working view per tab; dark yard-office console */
:root{
  --bg:#0a0f1f; --panel:#111830; --panel2:#17203d; --line:#24305a; --line2:#2f3d6e;
  --fg:#e6ebf7; --muted:#8d98b8; --dim:#5f6a8c;
  --accent:#5b8cff; --accent2:#93b2ff; --accentbg:rgba(91,140,255,.14);
  --ok:#2fbf71; --okbg:rgba(47,191,113,.14);
  --warn:#f2a93b; --warnbg:rgba(242,169,59,.15);
  --bad:#f0524f; --badbg:rgba(240,82,79,.15);
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1440px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(10,15,31,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar1{display:flex;align-items:center;gap:14px;padding-block:12px 8px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px}
.brand b{font-family:var(--f-display);font-weight:700;font-size:24px;letter-spacing:.02em}
.brand span{font-family:var(--f-display);font-size:16px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);padding:3px 9px;border:1px solid var(--line);border-radius:99px}
.live i{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px var(--okbg)}
.live.off i{background:var(--dim);box-shadow:none}
.spacer{flex:1}
.clock{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding-bottom:0}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;color:var(--muted);cursor:pointer;white-space:nowrap;font-family:var(--f-display);font-size:16px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.tab:hover{color:var(--fg)}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.tab kbd{font-family:var(--f-mono);font-size:10px;color:var(--dim);margin-left:4px;font-weight:400}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-block:10px;border-top:1px solid var(--line)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.seg button{background:none;border:0;padding:6px 10px;cursor:pointer;color:var(--muted);font-size:13px}
.seg button+button{border-left:1px solid var(--line2)}
.seg button[aria-pressed="true"]{background:var(--accentbg);color:var(--fg)}
.fld{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
input[type=date],select,input[type=search],input[type=text],textarea{background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:6px 9px;font-size:13px}
input[type=search]{width:180px;max-width:100%}
.btn{background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13px;display:inline-flex;align-items:center;gap:6px}
a.btn{text-decoration:none}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#08102a;font-weight:600}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
main{padding-block:18px 60px;display:grid;gap:18px}
.banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px;border:1px dashed var(--line2);border-radius:10px;color:var(--muted);font-size:13px}
.banner b{color:var(--warn);font-weight:600}
.banner.real b{color:var(--ok)}
h2{font-family:var(--f-display);font-weight:600;font-size:20px;letter-spacing:.05em;text-transform:uppercase;margin:0;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:600;font-size:16px;letter-spacing:.06em;text-transform:uppercase;margin:0;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:4px;position:relative;overflow:hidden}
.kpi .lab{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kpi .val{font-family:var(--f-display);font-size:40px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:12px;color:var(--dim)}
.kpi.bad{border-color:rgba(240,82,79,.5)} .kpi.bad .val{color:var(--bad)}
.kpi.warn .val{color:var(--warn)}
.kpi.blank{border-style:dashed}.kpi.blank .val{color:var(--dim)}
.kpis.kpis7{grid-template-columns:repeat(7,minmax(0,1fr))}.kpis7 .kpi .val{font-size:36px}
.kpi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--stripe,transparent)}
.grid{display:grid;gap:18px;grid-template-columns:repeat(12,minmax(0,1fr))}
.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:12px;min-width:0;align-content:start}
.card-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card-h .note{font-size:12px;color:var(--dim)}
.secnum{font-family:var(--f-mono);font-size:11px;color:var(--accent2);border:1px solid var(--line2);border-radius:5px;padding:1px 6px}
.mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.mini div{background:var(--panel2);border-radius:9px;padding:10px 12px}
.mini .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.mini .v{font-family:var(--f-display);font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.mini .s{font-size:11px;color:var(--dim)}
/* bar charts */
.bars{display:flex;align-items:flex-end;gap:10px;height:190px;padding-top:18px;border-bottom:1px solid var(--line2);position:relative}
.bars .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0;position:relative}
.bars .b .fill{width:100%;max-width:64px;border-radius:5px 5px 0 0;min-height:2px}
.bars .b .n{font-family:var(--f-mono);font-size:12px;margin-bottom:4px;font-variant-numeric:tabular-nums}
.xl{display:flex;gap:10px}.xl span{flex:1;text-align:center;font-size:11px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bars.thin{gap:3px}.bars.thin .b .fill{max-width:none;border-radius:3px 3px 0 0}
.bars.thin .b .n{font-size:10px}
.xl.thin{gap:3px}.xl.thin span{font-size:10px}
.stack{display:flex;flex-direction:column;width:100%;justify-content:flex-end}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.split{height:30px;border-radius:7px;overflow:hidden;display:flex;background:var(--panel2)}
.split div{display:flex;align-items:center;padding:0 10px;font-size:12px;font-weight:600;color:#08102a;white-space:nowrap;overflow:hidden}
.hbar{display:grid;grid-template-columns:minmax(80px,140px) 1fr 48px;gap:10px;align-items:center;font-size:13px}
.hbar .t{height:12px;background:var(--panel2);border-radius:4px;overflow:hidden}
.hbar .t div{height:100%;background:var(--accent);border-radius:4px}
.hbar .n{font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.hbars{display:grid;gap:8px}
/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--panel2);position:sticky;top:0}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:rgba(91,140,255,.05)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--f-mono)}
.vin{font-family:var(--f-mono);font-size:12px;letter-spacing:.02em}
.heat{border-radius:5px;padding:2px 8px;display:inline-block;min-width:30px;text-align:center}
tfoot td{font-weight:600;background:var(--panel2)}
.scroll{max-height:460px;overflow:auto}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap;letter-spacing:.02em}
.chip.ok{background:var(--okbg);color:var(--ok)}.chip.warn{background:var(--warnbg);color:var(--warn)}.chip.bad{background:var(--badbg);color:var(--bad)}.chip.info{background:var(--accentbg);color:var(--accent2)}.chip.mute{background:var(--panel2);color:var(--muted)}
.rules{display:flex;gap:8px;flex-wrap:wrap}
.empty{color:var(--dim);font-size:13px;padding:14px;text-align:center}
.alertcol{display:grid;gap:10px;align-content:start}
.alerth{display:flex;align-items:baseline;gap:10px;padding:10px 12px;border-radius:9px}
.alerth.warn{background:var(--warnbg)}.alerth.bad{background:var(--badbg)}
.alerth b{font-family:var(--f-display);font-size:34px;line-height:1}
.alerth.warn b{color:var(--warn)}.alerth.bad b{color:var(--bad)}
/* handover */
.ho-list{display:grid;gap:10px}
.ho{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;grid-template-columns:minmax(0,1.2fr) auto minmax(0,2fr);gap:14px;align-items:start}
.ho.done{border-color:rgba(47,191,113,.45)}
.ho .meta{display:grid;gap:4px;min-width:0}
.ho .meta .mdl{font-weight:600}
.ho .meta .sm{font-size:12px;color:var(--muted)}
.tick{display:flex;align-items:center;gap:8px;cursor:pointer;padding:8px 12px;border:1px solid var(--line2);border-radius:8px;background:var(--panel);white-space:nowrap;font-size:13px}
.tick input{width:18px;height:18px;accent-color:var(--ok)}
.ho .rm{display:grid;gap:6px;min-width:0}
.ho textarea{width:100%;min-height:54px;resize:vertical}
.ho .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.thumbs img{width:56px;height:56px;object-fit:cover;border-radius:6px;border:1px solid var(--line2);cursor:zoom-in;background:var(--panel)}
.who{font-size:11px;color:var(--dim)}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.lightbox{position:fixed;inset:0;background:rgba(5,8,18,.92);z-index:20;display:flex;align-items:center;justify-content:center;padding:24px}
.lightbox img{max-width:100%;max-height:100%;border-radius:8px}
.lightbox button{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:calc(14px + env(safe-area-inset-right,0px))}
.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line2);padding:9px 16px;border-radius:9px;z-index:30;font-size:13px;box-shadow:0 6px 24px rgba(0,0,0,.4)}
/* import */
.imp{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.imp .slot{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:8px;align-content:start}
.imp .slot h4{margin:0;font-size:14px}
.imp .cols{font-family:var(--f-mono);font-size:11px;color:var(--muted);line-height:1.6}
.imp .cols b{color:var(--fg);font-weight:500}
.imp .st{font-size:12px}
footer{color:var(--dim);font-size:12px;padding-block:0 30px}
.muted{color:var(--muted)}
p{margin:0}
@media (max-width:1250px){.kpis.kpis7{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:1100px){.kpis,.kpis.kpis7{grid-template-columns:repeat(3,minmax(0,1fr))}.c4,.c5,.c6,.c7,.c8{grid-column:span 12}}
@media (max-width:640px){.kpis,.kpis.kpis7{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi .val{font-size:32px}.ho{grid-template-columns:1fr}.tab kbd{display:none}.bars{height:150px}}
@media (prefers-reduced-motion:no-preference){.fill,.split div,.hbar .t div{transition:height .3s,width .3s}}

.ffl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bucketf .bk{display:inline-flex;flex-direction:column;align-items:center;gap:2px;min-width:74px;padding:6px 10px;border-radius:8px;border:1px solid var(--line2);background:var(--panel2);cursor:pointer;font-size:12px;color:var(--muted);border-left:3px solid var(--bc)}
.bucketf .bk span{font-family:var(--f-display);font-size:20px;font-weight:700;color:var(--fg);font-variant-numeric:tabular-nums}
.bucketf .bk.on{background:var(--accentbg);border-color:var(--accent);color:var(--fg)}
.sline{display:block;font-size:11px;color:var(--dim);font-family:var(--f-body);font-weight:400;white-space:nowrap}
.sline .blk{color:var(--accent2)}.sline .dmgc{color:var(--bad)}
.kpi .sub .sline{display:inline;font-size:12px;white-space:normal}
.ffl .fld{min-width:0;max-width:100%}.ffl select{max-width:min(280px,62vw)}
table.cft th,table.cft td{padding:7px 8px}
table.drill td{vertical-align:top}
table.drill tr.dr[data-dk]{cursor:pointer}
table.drill tr.l0 td{background:color-mix(in srgb,var(--panel2) 60%,transparent)}
table.drill tr.l0.open td{background:color-mix(in srgb,var(--accent) 12%,var(--panel))}
table.drill tr.l0.open td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
table.drill tr.l1 td:first-child{color:var(--fg)}table.drill tr.l2 td:first-child{color:var(--muted)}
table.drill tr.tot td{background:var(--panel2)}
.dname{display:flex;gap:6px;align-items:baseline;font-weight:500}
table.drill tr.l0 .dname{font-weight:600}
.caret{width:12px;color:var(--accent2);display:inline-block}
.vbars{display:flex;align-items:flex-end;gap:6px;height:280px;overflow-x:auto;padding-bottom:4px}
.vb{flex:1 0 46px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;background:none;border:0;cursor:pointer;color:var(--fg);padding:0 2px}
.vb .n{font-family:var(--f-mono);font-size:11px;margin-bottom:3px}
.vb .bar{width:70%;max-width:40px;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px}
.vb.on .bar{background:var(--warn)}.vb:hover .bar{background:var(--accent2)}
.vb .lbl{font-size:10px;color:var(--muted);height:64px;writing-mode:vertical-rl;transform:rotate(180deg);text-align:left;margin-top:6px;overflow:hidden;white-space:nowrap}
.lnk{background:none;border:0;color:var(--fg);cursor:pointer;padding:0;text-decoration:underline dotted var(--dim);font:inherit}
table.cft tfoot td{background:var(--panel2)}
.paintbars .hbar .t div{box-shadow:inset 0 0 0 1px rgba(255,255,255,.22)}
.sw{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px;box-shadow:0 0 0 1px rgba(255,255,255,.28)}

.ld{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:rgba(7,10,22,.82);backdrop-filter:blur(3px);padding:24px}
.ld[hidden]{display:none!important}
.ld-card{background:var(--panel);border:1px solid var(--line2);border-radius:16px;padding:22px 26px;display:grid;gap:10px;justify-items:center;width:min(340px,100%);box-shadow:0 20px 60px rgba(0,0,0,.45)}
.ld-svg{width:240px;max-width:100%;height:auto}
.ld-ground{stroke:var(--line2);stroke-width:2;stroke-dasharray:6 6}
.ld-body{fill:var(--accent)}.ld-glass{fill:#0b1226;opacity:.85}.ld-pillar{stroke:var(--accent);stroke-width:3}.ld-lamp{fill:#ffd36b}
.ld-tyre{fill:#0a0e1c;stroke:#3a4672;stroke-width:3}.ld-hub{fill:#9aa6c8}.ld-spoke{stroke:#0a0e1c;stroke-width:2}
.ld-leg{fill:none;stroke:#26408a;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.ld-suit{fill:#f2a93b}.ld-skin{fill:#c98d5a}.ld-cap{fill:#26408a}
.ld-sleeve{stroke:#f2a93b;stroke-width:5;stroke-linecap:round}.ld-wrench,.ld-wrench-h{fill:#c9d1e8}
.ld-sparks circle{fill:#ffd36b}
.ld-row{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-size:18px;letter-spacing:.04em;text-transform:uppercase}
.ld-spin{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--line2);border-top-color:var(--accent);display:inline-block}
.ld-list{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:12px;color:var(--muted);width:100%}
.ld-list li{display:flex;justify-content:space-between;gap:10px}
.ld-list .ok{color:var(--ok)}.ld-list .wait{color:var(--accent2)}.ld-list .err{color:var(--bad)}
.ld.pill{inset:auto calc(16px + env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) auto;background:none;backdrop-filter:none;padding:0;pointer-events:none}
.ld.pill .ld-card{padding:8px 12px;grid-template-columns:auto auto;align-items:center;width:auto;gap:10px;border-radius:12px}
.ld.pill .ld-svg{width:92px}.ld.pill .ld-list{display:none}.ld.pill .ld-row{font-size:13px}
@media (prefers-reduced-motion:no-preference){
  .ld-spin{animation:ldspin .8s linear infinite}
  .ld-wheel{animation:ldspin 1.4s linear infinite}.ld-wheel.slow{animation-duration:2.6s}
  .ld-car{animation:ldlift 1.6s ease-in-out infinite}
  .ld-arm{transform-origin:216px 80px;animation:ldwrench .55s ease-in-out infinite alternate}
  .ld-tech{animation:ldbob 1.1s ease-in-out infinite}
  .ld-sparks circle{animation:ldspark .55s steps(2) infinite}.ld-sparks circle:nth-child(2){animation-delay:.18s}.ld-sparks circle:nth-child(3){animation-delay:.36s}
  .ld-ground{animation:ldground 1.2s linear infinite}
}
@keyframes ldspin{to{transform:rotate(360deg)}}
@keyframes ldlift{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes ldwrench{from{transform:rotate(-14deg)}to{transform:rotate(16deg)}}
@keyframes ldbob{0%,100%{transform:translateY(0)}50%{transform:translateY(1px)}}
@keyframes ldspark{0%{opacity:1}100%{opacity:0}}

const DAY=86400000;
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());

const days=(a,b)=>Math.round((pd(b)-pd(a))/DAY);
const fmtD=s=>{if(!s)return "—";const d=pd(s);return d.getDate()+" "+d.toLocaleString("en-IN",{month:"short"})};
const fmtT=ms=>new Date(ms).toLocaleString("en-IN",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});

/* Dates: sheets mix dd-mm-yyyy text with a few mm-dd-yyyy cells. Read dd-mm first; switch to mm-dd only when dd-mm lands in the future or months back and mm-dd lands in the recent past. */
function pDate(v){
  if(v==null)return "";const s=String(v).trim();if(!s)return "";let m;
  if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/)))return m[1]+"-"+pad(m[2])+"-"+pad(m[3]);
  if((m=s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/))){
    let a=+m[1],b=+m[2],y=+m[3];if(y<100)y+=2000;
    const ok=(d,mo)=>mo>=1&&mo<=12&&d>=1&&d<=31;
    const dm=ok(a,b)?new Date(y,b-1,a):null, md=ok(b,a)?new Date(y,a-1,b):null;
    if(dm&&!md)return iso(dm);if(md&&!dm)return iso(md);if(!dm)return "";

}
function parseCSV(t){
  const rows=[];let row=[],f="",q=false;

    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;else if(c===","){row.push(f);f=""}
    else if(c==="\n"){row.push(f);rows.push(row);row=[];f=""}
    else if(c!=="\r")f+=c}

}
function toObjects(aoa){
  let hi=aoa.findIndex(r=>r.filter(x=>String(x).trim()).length>=3);if(hi<0)return [];
  const seenH={};const hdr=aoa[hi].map(x=>{const h=norm(x);if(!h)return h;if(seenH[h]===undefined){seenH[h]=0;return h}seenH[h]++;return h+seenH[h]});
  const body=aoa.slice(hi+1).filter(r=>r.some(c=>String(c==null?"":c).trim()));
  /* A day-month text column saved through a US-locale spreadsheet keeps days 13–31 as text but turns days 1–12 into real dates with day and month swapped
     (10-11-2026 becomes 11 Oct). When a date column holds such text alongside real dates, swap the real dates back. */
  const swapCol=hdr.map((h,i)=>{if(!/date|dt$/.test(h))return false;let txt=0,ser=0;
    for(const r of body){const v=r[i];if(typeof v==="number")ser++;else if(typeof v==="string"){const m=v.trim().match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.]\d{2,4}/);if(m&&+m[1]>12)txt++}}
    return txt>0&&ser>0});
  const T1=today0().getTime()+DAY;
  const cell=(h,v,i)=>{if(v==null)return "";
    if(typeof v==="number"&&/date|dt$/.test(h)&&v>20000&&v<80000){const d=new Date(Math.floor(v-25569)*DAY);let y=d.getUTCFullYear(),mo=d.getUTCMonth()+1,da=d.getUTCDate();
      const sw=()=>{if(da<=12){const t=mo;mo=da;da=t}};
      if(swapCol[i])sw();else if(new Date(y,mo-1,da).getTime()>T1&&da<=12&&new Date(y,da-1,mo).getTime()<=T1)sw();
      return y+"-"+pad(mo)+"-"+pad(da)}
    return String(v).trim()};
  return body.map(r=>{const o={};hdr.forEach((h,i)=>{if(h&&o[h]===undefined)o[h]=cell(h,r[i],i)});return o});
}

/* ---------- state ---------- */
const S={files:{},diag:{},live:{},snap:{},src:{stock:{},pdi:{},jobs:{},ibnd:{},delivery:{}},stockScope:"all",hsrp:[],hsrpMeta:null,handover:{},
  filters:{preset:"mtd",from:"",to:"",model:"",q:"",loc:""},sf:{model:"",variant:"",colour:"",channel:"",tour:"",trans:"",year:"",bucket:-1},open:{},lf:{sup:"",tech:"",model:"",status:"Completed"},hsrpFilter:"notfitted",hoFilter:"open",pdiFilter:"all",tab:"overview",
  db:null,mcp:null,assets:null,user:null,uid:null,canWrite:true,names:{},snapDocs:{}};
const TABS=[["overview","Overview"],["stock","Stock"],["pdi","PDI"],["transit","In transit"],["labour","Labour"],["pending","Pending"],["hsrp","HSRP"],["ibnd","IBND"],["handover","Handover"],["data","Data"]];
const rowsOf=k=>S.live[k]?S.live[k].rows:S.snap[k]?S.snap[k].rows:[];

/* ---------- derive ---------- */
const isDone=s=>/complet|done|^ok$|approved/i.test(s||"");
const isStarted=s=>/start|progress|wip/i.test(s||"");
const YARD_STATUS=/^ok$/i;
function derive(){
  const T=iso(today0());
  const delivered=new Set(rowsOf("delivery").map(d=>d.vin).concat(rowsOf("pdi").filter(p=>p.deliveryDate).map(p=>p.vin)).filter(Boolean));
  const allot=rowsOf("ibnd").filter(v=>!delivered.has(v.vin)).map(v=>({...v,kind:"Allotted",yard:v.stockLoc,dealerLoc:v.branch,remarks:"Allotted · "+(v.docket||"")}));
  const allotV=new Set(allot.map(v=>v.vin));
  const free=rowsOf("stock").filter(v=>!delivered.has(v.vin)&&!allotV.has(v.vin)).map(v=>({...v,kind:"Free"}));
  const all=free.concat(allot);
  {const dom=today0().getDate();all.forEach(v=>tagStock(v,T,dom))}
  const sc=S.stockScope;const stock=sc==="free"?free:sc==="allotted"?allot:all;

  const jobs=rowsOf("jobs");
  const jobsBy={};for(const j of jobs){(jobsBy[j.chassis]=jobsBy[j.chassis]||[]).push(j)}
  const pdiRows=rowsOf("pdi").filter(p=>!p.deliveryDate);
  const seen={};
  const pipe=pdiRows.map(p=>{
    const key=p.chassis||p.vin;seen[key]=(seen[key]||0)+1;
    const done=isDone(p.st[3][1]);
    const cur=p.st.find(s=>!isDone(s[1]));
    const start=p.docket||p.planEntry;
    const age=start?Math.max(0,days(start,T)):0;
    const fiEnd=p.st[3][3];
    const lines=jobLines(jobsBy[p.chassis]||[]);
    const acc={total:lines.length,done:lines.filter(l=>l.done).length,value:lines.reduce((a,l)=>a+l.value,0)};
    const reTxt=/re[\s-]?pdi|repdi|re[\s-]?inspect/i.test([p.pdiRemark,p.st[0][4],p.st[3][4]].join(" "));
    return {...p,key,done,cur:cur?cur[0]:"Ready",curStatus:cur?cur[1]:"Completed",age,doneDate:done?(fiEnd||""):"",tat:done&&start&&fiEnd?days(start,fiEnd):null,
      overdue:!done&&p.finalPlan&&p.finalPlan<T,acc,reTxt};
  });

  const supLoc={...SUP_LOC},chLoc={};
  pipe.forEach(p=>{const l=normLoc(p.pdiLoc);if(l){supLoc[norm(p.supervisor)]=l;chLoc[p.chassis]=l}});
  rowsOf("ibnd").forEach(v=>{const l=normLoc(v.stockLoc);if(l&&!chLoc[v.chassis])chLoc[v.chassis]=l});
  const locOf=j=>supLoc[norm(j.supervisor)]||chLoc[j.chassis]||"Other";
  const modelBy={};rowsOf("ibnd").forEach(v=>{if(v.chassis)modelBy[v.chassis]=v.model});pipe.forEach(p=>{if(p.chassis)modelBy[p.chassis]=p.model});

let _labR=null,_lab=false;const LAB=()=>{const r=rowsOf("jobs");if(r!==_labR){_labR=r;_lab=r.some(x=>x.labour!=null)}return _lab};
/* Calicut / Malappuram. Yard names say it directly (CALICUT-x, x KODUR); otherwise the dealer location's town decides. */
const TOWN_LOC=[[/MAVOOR|KODUVALLY|KUTTIYADI|RAMANATTUKARA|PUTHIYANGADI|CHUNGAM|FEROKE|VADAKARA|BALUSSERY|THAMARASSERY|MUKKAM|NADAPURAM|PAYYOLI|KOYILANDY|PANTHEERAMKAVU/,"CALICUT"],
  [/DOWN ?HILL|KODUR|MANJERI|KOTTAKKAL|CHANGARAMKULAM|PATTAMBI|CHETTIPPADI|CHENIKKAL|NELLIPUZHA|KUNNAMKULAM|TIRUR|PERINTHALMANNA|NILAMBUR|KONDOTTY|PONNANI|EDAPPAL|VALANCHERY/,"MALAPPURAM"]];
function normLoc(x){x=String(x||"").toUpperCase();if(!x)return "";if(/CALICUT|KOZHIKODE|CLT/.test(x))return "CALICUT";if(/MAL+APP?URAM|MLP/.test(x))return "MALAPPURAM";for(const [re,l] of TOWN_LOC)if(re.test(x))return l;return ""}
const NEXA=/BALENO|FRONX|GRAND VITARA|INVICTO|XL6|JIMNY|IGNIS|CIAZ|E VITARA/i;
function tagStock(v,T,dom){
  v.loc=normLoc(v.yard)||normLoc(v.dealerLoc)||normLoc(v.stockLoc)||"";
  v.channel=NEXA.test(v.model||"")?"NEXA":"ARENA";
  v.tour=/\bTOUR\b/i.test(v.variant||"")?"TOUR":"OTHER";
  v.trans=/\b(AGS|AMT|CVT|\d?AT|EV)\b|KWH/i.test(v.variant||"")?"AUTO":"MANUAL";
  v.atYard=YARD_STATUS.test(v.status);
  v.blk=/block/i.test(v.remarks||"");v.dmg=/damag/i.test(v.remarks||"");
  v.carry=v.grn?v.grn<T.slice(0,8)+"01":v.aging>=dom;
  return v;
}
function jobLines(rows){
  const grp={};
  for(const r of rows){const k=r.jc+"|"+r.item+"|"+r.rate;const o=grp[k]=grp[k]||{jc:r.jc,chassis:r.chassis,model:r.model,item:r.item,rate:r.rate,labour:r.labour||0,techs:{},done:true,assigned:r.assigned,workDate:r.workDate,supervisor:r.supervisor,customer:r.customer,branch:r.branch};
    o.techs[r.tech]=(o.techs[r.tech]||0)+1;if(!isDone(r.status))o.done=false;if(r.workDate&&r.workDate>(o.workDate||""))o.workDate=r.workDate}
  return Object.values(grp).map(o=>{const units=Math.max(...Object.values(o.techs));return {...o,units,value:(LAB()?o.labour:o.rate)*units,itemValue:o.rate*units,techList:Object.keys(o.techs).filter(Boolean)}});

function range(m){

  else if(f.preset==="mtd"){to=T;from=T.slice(0,8)+"01"}

const qm=(...vals)=>{const q=S.filters.q.toUpperCase().replace(/\s/g,"");if(!q)return true;return vals.some(v=>String(v||"").toUpperCase().replace(/\s/g,"").includes(q))};
const mm=m=>!S.filters.model||m===S.filters.model;
const lm=l=>!S.filters.loc||l===S.filters.loc;

const bucketOf=d=>BUCKETS.findIndex(([l,a,b])=>Math.round(d)>=a&&Math.round(d)<=b);
const fSX=v=>{const f=S.sf;return fStock(v)&&(!f.model||v.model===f.model)&&(!f.variant||v.variant===f.variant)&&(!f.colour||v.colour===f.colour)&&(!f.channel||v.channel===f.channel)&&(!f.tour||v.tour===f.tour)&&(!f.trans||v.trans===f.trans)&&(!f.year||v.year===f.year)&&(f.bucket<0||bucketOf(v.aging)===f.bucket)};

const BUCKETS=[["0–13",0,13],["14–20",14,20],["21–30",21,30],["31–45",31,45],["46–60",46,60],["61–90",61,90],["90+",91,1e9]];

const countBy=(arr,fn)=>{const o={};arr.forEach(x=>{const k=fn(x)||"—";o[k]=(o[k]||0)+1});return Object.entries(o).sort((a,b)=>b[1]-a[1])};
const legendAge=()=>`<div class="legend"><span><i style="background:var(--ok)"></i>0–20 days</span><span><i style="background:var(--warn)"></i>21–30 days</span><span><i style="background:var(--bad)"></i>31+ days, darker = older</span></div>`;

    </tbody></table></div></div></div>`;
}
const bIdx=d=>BUCKETS.findIndex(([l,a,b])=>d>=a&&d<=b);
const ageChip=d=>{const i=Math.max(0,bIdx(Math.round(d)));return `<span class="heat" style="background:${bbg(i)};color:${bcol(i)}">${Math.round(d)} d</span>`};
function scopeSeg(){return `<div class="seg" id="scopeSeg" style="margin-left:auto">${[["all","All"],["free","Free stock"],["allotted","Allotted (IBND)"]].map(([k,l])=>`<button data-sc="${k}" aria-pressed="${S.stockScope===k}">${l}</button>`).join("")}</div>`}
function stockLine(arr){const d=arr.filter(v=>v.atYard).length,t=arr.length-d,b=arr.filter(v=>v.blk).length,x=arr.filter(v=>v.dmg).length;
  return `<span class="sline">${num(d)} dealer · ${num(t)} transit${b?` · <span class="blk">${num(b)} blkd</span>`:""}${x?` · <span class="dmgc">${num(x)} dmg</span>`:""}</span>`}
const cfCell=p=>{const c=p>=95?"var(--bad)":p>=85?"#f27a5c":p>=75?"var(--warn)":"var(--ok)";return `<span class="heat" style="background:color-mix(in srgb, ${c} 22%, transparent);color:${c}">${p.toFixed(1)}%</span>`};
/* Carry-forward = stock received before the 1st of this month (GRN date before the 1st, or Aging at least today's day of month when GRN is blank). */
function carryTable(rows,full){
  const by={};rows.forEach(v=>{const o=by[v.model||"—"]=by[v.model||"—"]||[];o.push(v)});
  const list=Object.entries(by).sort((a,b)=>b[1].length-a[1].length);
  const cf=a=>a.filter(v=>v.carry).length;const tot=rows.length,tc=cf(rows);
  return `<div class="tw${full?"":" scroll"}"><table class="cft"><thead><tr><th>Model</th><th class="num">Total stock</th><th class="num">Carry forward</th><th class="num">%</th></tr></thead><tbody>
    ${list.map(([k,a])=>{const c=cf(a);return `<tr><td>${esc(k)}</td><td class="num">${num(a.length)}</td><td class="num">${num(c)}</td><td class="num">${cfCell(a.length?c/a.length*100:0)}</td></tr>`}).join("")||`<tr><td colspan="4" class="empty">No stock matches the filters.</td></tr>`}</tbody>
    <tfoot><tr><td>Total</td><td class="num">${num(tot)}</td><td class="num">${num(tc)}</td><td class="num">${tot?(tc/tot*100).toFixed(2)+"%":"—"}</td></tr></tfoot></table></div>`;
}
function stockTotals(rows){const avg=rows.length?rows.reduce((a,v)=>a+v.aging,0)/rows.length:0;const cf=rows.filter(v=>v.carry).length;return {n:rows.length,avg,cf,cfp:rows.length?cf/rows.length*100:0}}
function drillTable(rows){
  const B=BUCKETS.length;
  const agg=a=>{const b=BUCKETS.map(()=>0);let age=0,cf=0;a.forEach(v=>{const i=bucketOf(v.aging);if(i>=0)b[i]++;age+=v.aging;if(v.carry)cf++});return {b,age:a.length?age/a.length:0,cf,n:a.length}};
  const group=(a,key)=>{const o={};a.forEach(v=>{const k=v[key]||"—";(o[k]=o[k]||[]).push(v)});return Object.entries(o).sort((x,y)=>y[1].length-x[1].length)};
  const cell=(n,i)=>n?`<span class="heat" style="background:${bbg(i)};color:${bcol(i)}">${n}</span>`:`<span class="muted">·</span>`;
  const row=(lvl,key,label,a,hasKids,isColour)=>{const g=agg(a);const open=!!S.open[key];
    return `<tr class="dr l${lvl}${open?" open":""}" ${hasKids?`data-dk="${esc(key)}" tabindex="0"`:""}><td><div class="dname" style="padding-left:${lvl*18}px">${hasKids?`<span class="caret">${open?"▾":"▸"}</span>`:`<span class="caret"></span>`}${isColour?swatch(label):""}<span>${esc(label)}</span></div></td>

  let html="";
  for(const [mdl,a] of group(rows,"model")){const k1="m|"+mdl;html+=row(0,k1,mdl,a,true);
    if(S.open[k1])for(const [vr,b] of group(a,"variant")){const k2=k1+"|"+vr;html+=row(1,k2,vr,b,true);
      if(S.open[k2])for(const [cl,c] of group(b,"colour"))html+=row(2,k2+"|"+cl,cl,c,false,true)}}

  return `<div class="tw scroll" style="max-height:640px"><table class="drill"><thead><tr><th>Model / variant / colour</th><th class="num">Stock</th>${BUCKETS.map(b=>`<th class="num">${b[0]}</th>`).join("")}<th class="num">Carry fwd</th><th class="num">CF %</th><th class="num">Avg age</th></tr></thead>

}
function selOpts(id,label,vals,cur){return `<label class="fld" for="${id}">${label} <select id="${id}" data-sf="${id.slice(2).toLowerCase()}"><option value="">All</option>${vals.map(v=>`<option ${v===cur?"selected":""} value="${esc(v)}">${esc(v)}</option>`).join("")}</select></label>`}
function segF(key,opts){return `<div class="seg" data-sfseg="${key}">${[["","All"]].concat(opts).map(([k,l])=>`<button data-v="${k}" aria-pressed="${S.sf[key]===k}">${l}</button>`).join("")}</div>`}
/* Paint colour from the colour name. Dual-tone names ("RED + BLUISH BLACK", "with Black Roof") get the roof colour as an end band. */
const PAINT=[[/arctic|pearl.*white/,"#f1f0ea"],[/white/,"#fbfbfb"],[/bluish black/,"#1c2433"],[/midnight black|black/,"#0d0d12"],
  [/sizzling/,"#c8102e"],[/opulent/,"#8e1b23"],[/gallant|lucent red|red/,"#b3121b"],[/maroon|wine/,"#6d1a26"],
  [/magma/,"#5c5f63"],[/granite/,"#45484d"],[/glisten/,"#8d9094"],[/gr[ae]y/,"#7d8085"],[/silver/,"#c3c7cc"],
  [/nexa blue|celestial/,"#1d4e9e"],[/eternal blue/,"#1f3a6e"],[/speedy|blue/,"#1e5bb8"],
  [/nut?m?eg|brown/,"#6b4a33"],[/bronze|copper/,"#8c6239"],[/orange/,"#e86a1d"],[/yellow/,"#e6b800"],[/green/,"#2e7d32"],[/beige|gold/,"#cdb27a"]];
function paintOf(name){const t=String(name||"").toLowerCase();if(!t)return "";
  const parts=t.split(/\s*\+\s*|\s+with\s+|\(/);const hit=x=>{for(const [re,c] of PAINT)if(re.test(x))return c;return ""};
  const main=hit(parts[0])||hit(t);if(!main)return "";
  const roof=parts.length>1?hit(parts.slice(1).join(" ")):"";
  return roof&&roof!==main?`linear-gradient(90deg, ${main} 0 82%, ${roof} 82%)`:main;}
const swatch=n=>{const p=paintOf(n);return p?`<i class="sw" style="background:${p}"></i>`:""};

/* ---------- 4 Labour ---------- */
/* Labour = plain sum of Labour Charge on job card rows with the chosen Status (Completed by default) and Assigned Date in range.
   Each technician's row carries its own charge, so rows are neither merged nor split. */
const jobModel=(m,j)=>m.modelBy[j.chassis]||baseModel(j.model);
const MODEL_WORDS=[["WAGON","WagonR"],["SWIFT","Epic New Swift"],["ALTO","NEW ALTO K10"],["DZIRE","Dazzling New Dzire"],["VICTORIS","VICTORIS"],["EECO","EECO"],["BALENO","NEW BALENO"],["GRAND VITARA","GRAND VITARA"],["S-PRESSO","S-PRESSO"],["SPRESSO","S-PRESSO"],["CELERIO","NEW CELERIO"],["ERTIGA","NEW ERTIGA"],["E VITARA","e VITARA"],["BREZZA","NEW BREZZA"],["XL6","XL6"],["FRONX","FRONX"],["CARRY","SUPER CARRY"],["INVICTO","INVICTO"],["JIMNY","JIMNY"]];
function baseModel(t){t=String(t||"").toUpperCase();for(const [w,n] of MODEL_WORDS)if(t.includes(w))return n;return t?t.split(" ").slice(0,2).join(" "):""}
function labourBase(m,R){
  return m.jobs.filter(j=>(R.all||inR(j.assigned,R))&&(!S.filters.model||jobModel(m,j)===S.filters.model)&&qm(j.chassis,j.customer,j.jc)&&lm(m.locOf(j)));
}
function labourCalc(m,R){
  const lab=LAB(),f=S.lf;
  const base=labourBase(m,R);
  const pick=base.filter(j=>(!f.sup||j.supervisor===f.sup)&&(!f.tech||j.tech===f.tech)&&(!f.model||jobModel(m,j)===f.model));
  const st=f.status;const want=j=>st==="All"?true:st==="Completed"?isDone(j.status):String(j.status||"").toLowerCase()===st.toLowerCase();
  const amt=j=>(lab?j.labour:j.rate)||0;
  const lines=pick.filter(want).map(j=>({...j,value:amt(j),units:1,done:isDone(j.status),techList:j.tech?[j.tech]:[],mdl:jobModel(m,j)}));
  const open=st==="Completed"?pick.filter(j=>!isDone(j.status)):[];
  const total=lines.reduce((a,l)=>a+l.value,0);
  const openV=open.reduce((a,j)=>a+amt(j),0);
  const cars=new Set(lines.map(l=>l.jc)).size;
  const tech={};
  const T=t=>tech[t]=tech[t]||{name:t,value:0,done:0,pending:0,cars:new Set(),locs:{},sups:{}};
  for(const l of lines){if(!l.tech)continue;const o=T(l.tech);o.value+=l.value;o.cars.add(l.jc);o.done++;const loc=m.locOf(l);o.locs[loc]=(o.locs[loc]||0)+1;o.sups[l.supervisor]=1}
  for(const j of open){if(j.tech&&tech[j.tech])tech[j.tech].pending++}
  const people=Object.values(tech).sort((a,b)=>b.value-a.value);
  people.forEach(p=>{const e=Object.entries(p.locs).sort((a,b)=>b[1]-a[1]);p.loc=e.length?(e[0][0]==="Other"?"—":e[0][0].charAt(0)+e[0][0].slice(1).toLowerCase()):"—"});
  return {base,lines,total,openV,openN:open.length,cars,people,perPerson:people.length?total/people.length:0,perCar:cars?total/cars:0};
}
function labourByLoc(m,R,c){
  c=c||labourCalc(m,R);const out={};
  for(const l of c.lines){const loc=m.locOf(l);const o=out[loc]=out[loc]||{loc,value:0,techs:new Set(),cars:new Set(),done:0};o.value+=l.value;l.techList.forEach(t=>o.techs.add(t));o.cars.add(l.jc);if(l.done)o.done+=l.value}
  const order=["CALICUT","MALAPPURAM","Other"];
  const um=new Set();c.lines.forEach(l=>{if(m.locOf(l)==="Other")um.add(l.supervisor||"no supervisor")});
  return {c,unmapped:[...um],locs:Object.values(out).sort((a,b)=>order.indexOf(a.loc)-order.indexOf(b.loc))};
}
function labourLocTable(L){
  const tr=(name,v,t,cars,cls)=>`<tr${cls?` class="${cls}"`:""}><td>${name}</td><td class="num">${inr(v)}</td><td class="num">${t}</td><td class="num">${t?inr(v/t):"—"}</td><td class="num">${cars}</td><td class="num">${cars?inr(v/cars):"—"}</td></tr>`;

    ${L.locs.map(o=>tr(o.loc==="Other"?"Not mapped":o.loc.charAt(0)+o.loc.slice(1).toLowerCase(),o.value,o.techs.size,o.cars.size)).join("")||`<tr><td colspan="6" class="empty">No job lines in this date range.</td></tr>`}</tbody>

}
function hsrpSection(m,full){

/* ---------- IBND: physical vehicle, plan not entered, by fund % ----------
   Physical vehicle with plan not entered = second "Vehicle secondary dispatch date" (_1) filled and Plan Entered Date blank.
   TAT = today minus that dispatch date: Same Day (0), 1 Day (24h+), 2 Days (48h+), 3 Days, More than 3 Days. */
const TAT_ROWS=[["Same Day",0,0],["1 Day",1,1],["2 Days",2,2],["3 Days",3,3],["More Than 3 Days",4,1e9]];
const FUND_COLS=[["0–25",-1e9,25],["25–50",25,50],["50–75",50,75],["75–100",75,100.0001],["Above 100",100.0001,1e9]];
function planNotEntered(m){
  return m.allot.filter(v=>v.dispatch2&&!String(v.planEntered||"").trim()&&fStock(v)).map(v=>{
    const d=Math.max(0,days(v.dispatch2,m.T));const r=TAT_ROWS.findIndex(([l,a,b])=>d>=a&&d<=b);
    const f=v.fundPct;const c=f==null||isNaN(f)?0:FUND_COLS.findIndex(([l,a,b])=>f>=a&&f<b);
    return {...v,tatDays:d,ri:r,ci:c<0?0:c}});
}
function ibndSection(m){
  if(!hasData("ibnd"))return `<div class="card c12"><div class="card-h"><h2>IBND</h2></div>${noData("ibnd")}</div>`;
  const P=planNotEntered(m);
  const cnt=(ri,ci)=>P.filter(v=>(ri<0||v.ri===ri)&&(ci<0||v.ci===ci)).length;
  const sel=S.pneSel||{ri:-2,ci:-2};
  const cell=(ri,ci,cls)=>{const n=cnt(ri,ci);const on=sel.ri===ri&&sel.ci===ci;return `<td class="num ${cls||""}"><button class="pc${on?" on":""}" data-pr="${ri}" data-pcol="${ci}" ${n?"":"disabled"}>${n||""}</button></td>`};
  const shown=sel.ri>-2?P.filter(v=>(sel.ri<0||v.ri===sel.ri)&&(sel.ci<0||v.ci===sel.ci)):P;
  const label=sel.ri>-2?`${sel.ri<0?"All TAT":TAT_ROWS[sel.ri][0]} · ${sel.ci<0?"all fund %":"fund "+FUND_COLS[sel.ci][0]+"%"}`:"all";
  const noF=P.filter(v=>v.fundPct==null||isNaN(v.fundPct)).length;
  return `<div class="grid"><div class="card c12"><div class="card-h"><h2>Physical vehicle · plan not entered, by fund %</h2><span class="pneTot">${num(P.length)}</span></div>
    <p class="muted" style="font-size:12px">IBND vehicles with the second Vehicle secondary dispatch date filled and Plan Entered Date blank. TAT = days from that dispatch date to today. Click a number to list those vehicles.</p>
    <div class="tw"><table class="pne"><thead><tr><th>TAT category</th>${FUND_COLS.map(c=>`<th class="num">${c[0]}</th>`).join("")}<th class="num">Total</th></tr></thead><tbody>
    ${TAT_ROWS.map((r,ri)=>`<tr><td>${r[0]}</td>${FUND_COLS.map((c,ci)=>cell(ri,ci)).join("")}${cell(ri,-1,"tcol")}</tr>`).join("")}</tbody>
    <tfoot><tr><td>Total</td>${FUND_COLS.map((c,ci)=>cell(-1,ci,"tcol")).join("")}${cell(-1,-1,"tcol")}</tr></tfoot></table></div>
    ${noF?`<p class="muted" style="font-size:12px">${noF} with a blank Fund % are counted under 0–25.</p>`:""}</div>
  <div class="card c12"><div class="card-h"><h2>Vehicles</h2><span class="note">${esc(label)} · ${num(shown.length)}, longest waiting first</span>${sel.ri>-2?`<button class="btn" id="pneAll" style="margin-left:auto">Show all</button>`:""}</div>
    <div class="tw scroll"><table><thead><tr><th>Chassis</th><th>Model</th><th>Variant</th><th>Colour</th><th>Branch</th><th>Dispatch date</th><th class="num">TAT</th><th class="num">Fund %</th><th>Location</th><th>Docket</th></tr></thead><tbody>
    ${shown.slice().sort((a,b)=>b.tatDays-a.tatDays).slice(0,400).map(v=>`<tr><td class="vin">${esc(v.chassis)}</td><td>${esc(v.model)}</td><td>${esc(v.variant)}</td><td>${swatch(v.colour)}${esc(v.colour)}</td><td>${esc(v.branch)}</td><td>${fmtD(v.dispatch2)}</td><td class="num">${v.tatDays===0?`<span class="chip ok">Same day</span>`:v.tatDays>3?`<span class="chip bad">${v.tatDays} d</span>`:`<span class="chip warn">${v.tatDays} d</span>`}</td><td class="num">${v.fundPct==null||isNaN(v.fundPct)?"—":v.fundPct.toFixed(2)}</td><td>${v.loc?v.loc.charAt(0)+v.loc.slice(1).toLowerCase():"—"}</td><td>${esc(v.docket)}</td></tr>`).join("")||`<tr><td colspan="10" class="empty">No vehicles.</td></tr>`}
    </tbody></table></div></div></div>`;
}

  $("#fModel").innerHTML=`<option value="">All models</option>`+models.map(x=>`<option ${x===S.filters.model?"selected":""}>${esc(x)}</option>`).join("");
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",String(t.dataset.t===S.tab)));

/* ---------- handover persistence ---------- */
const chains={};
function saveHO(id,patch){
  const next=Object.assign({},S.handover[id]||{},patch,{updatedBy:S.uid||"",updatedAt:new Date().toISOString()});
  S.handover[id]=next;render();
  if(!S.db)return Promise.resolve();
  chains[id]=(chains[id]||Promise.resolve()).then(()=>S.db.doc("handover/"+id).set(S.handover[id])).catch(err=>{
    if(err&&err.code==="invalid_argument"){S.canWrite=false;toast("You can't save changes here: view-only access")}else toast("Couldn't save. Check your connection and try again.");render()});
  return chains[id];
}
async function compress(file,max,q){
  const url=URL.createObjectURL(file);
  try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    const sc=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);return await new Promise(res=>c.toBlob(res,"image/jpeg",q))}finally{URL.revokeObjectURL(url)}
}
async function addPhoto(id,file){
  if(!S.db){toast("Saving is off in this view");return}
  toast("Uploading photo…");
  try{let entry=null;
    if(S.assets){try{const r=await S.assets.upload(await compress(file,1600,.82),{type:"image/jpeg"});entry={a:r.id}}catch(err){if(err&&err.code==="too_large"){toast("Photo is too large");return}}}
    if(!entry){const blob=await compress(file,900,.6);const data=await new Promise(res=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.readAsDataURL(blob)});
      if(data.length>240000){toast("Photo is too large to save. Try a smaller one.");return}
      const ref=await S.db.collection("photos").add({vin:id,data,by:S.uid||"",at:new Date().toISOString()});entry={p:ref.id};photoCache[ref.id]=data}
    await saveHO(id,{photos:((S.handover[id]||{}).photos||[]).concat([entry])});toast("Photo added");
  }catch(err){toast("Couldn't add the photo. Try again.")}
}
const photoCache={};
function hydratePhotos(){document.querySelectorAll('img[data-ph^="p:"]').forEach(async img=>{const id=img.dataset.ph.slice(2);if(photoCache[id]){img.src=photoCache[id];return}if(!S.db)return;try{const d=await S.db.doc("photos/"+id).get();if(d.exists){photoCache[id]=d.data().data;img.src=photoCache[id]}}catch(e){}})}

    const rows=objs.map(o=>({chassis:g(o,"Chassis No","Chassis","VIN No","VIN"),regNo:g(o,"Reg No","Registration No","Vehicle No"),fittedDate:pDate(g(o,"HSRP Fitted Date","Fitted Date","Fitment Date")),fitted:g(o,"HSRP Status","Fitted","HSRP Fitted"),deliveryDate:pDate(g(o,"Delivery Date","Delivered Date")),delivered:g(o,"Delivered","Delivery Status")})).filter(r=>r.chassis);

/* ---------- live Google Sheets via Drive connector ---------- */
const SERVER="Google Drive",TOOL="download_file_content";
const watches={};
function b64text(b64){const bin=atob(b64);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new TextDecoder("utf-8").decode(u)}
function errMsg(e){
  const c=e&&e.code;
  if(c==="server_not_connected"||c==="server_not_found")return "Connect Google Drive in claude.ai Settings → Connectors to see the live sheets.";
  if(c==="needs_reauth")return "Reconnect Google Drive in claude.ai Settings → Connectors.";
  if(c==="selection_required")return "Choose which Google Drive connection this page should use when claude.ai asks.";
  if(c==="not_in_manifest")return "Google Drive is turned off for this page. Turn it on from the page's permissions.";
  if(c==="blocked_by_policy"||c==="approval_required")return "Your organization's policy blocks this Google Drive tool here.";
  if(c==="tool_error")return "Google Drive couldn't open this sheet. Check that it's shared with your Google account.";
  if(c==="not_granted"||c==="capability_disabled"||c==="capability_removed")return "Live sheets can't be read in this view.";
  return "Google Drive didn't answer. It will try again shortly.";
}
function decode(pl){
  const b64=typeof pl==="string"?pl:pl&&pl.content;if(!b64)throw new Error("empty file");
  const mt=pl&&pl.mimeType||"";
  if(/csv|text/.test(mt))return {aoa:parseCSV(b64text(b64)),size:b64.length,h:hash(b64.slice(0,200000))+b64.length};
  if(!window.XLSX)throw new Error("Excel reader didn't load");
  const wb=XLSX.read(b64,{type:"base64",cellDates:false,dense:true});
  const ws=wb.Sheets[wb.SheetNames[0]];
  return {aoa:XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:""}),size:b64.length,h:hash(b64.slice(0,200000))+b64.length};
}
function onSheet(k,ev){
  if(ev.type==="error"){
    const code=ev.error&&ev.error.code;
    const deny=["needs_reauth","server_not_connected","blocked_by_policy","approval_required","not_in_manifest","selection_required"].includes(code);
    if(deny)delete S.live[k];
    S.src[k]={state:"error",msg:errMsg(ev.error),code};soon();
    writeDiag(k,{ok:false,code:code||"",message:String(ev.error&&ev.error.message||"").slice(0,300)});return}
  try{
    const t0=performance.now();
    const {aoa,size,h}=decode(ev.result.payload);
    if(S.standalone){ingest(k,aoa,ev.result.cache&&ev.result.cache.storedAt||Date.now(),h);return}
    const objs=toObjects(aoa);
    if(objs.length&&!SHEETS[k].need.every(x=>x in objs[0])){S.src[k]={state:"error",msg:`The ${SHEETS[k].label} is missing expected columns (${SHEETS[k].need.join(", ")}).`};soon();writeDiag(k,{ok:false,code:"columns",headers:Object.keys(objs[0]).slice(0,120)});return}
    const rows=objs.map(MAP[k]);
    const at=ev.result.cache&&ev.result.cache.storedAt||Date.now();
    S.live[k]={rows,at};S.src[k]={state:"live"};soon();
    writeDiag(k,{ok:true,rows:rows.length,b64:size,ms:Math.round(performance.now()-t0),headers:Object.keys(objs[0]||{}).slice(0,120),sample:rows[0]||null});
    saveSnapshot(k,snapRows(k,rows),h+":p4",at);
  }catch(e){S.src[k]={state:"error",msg:`Couldn't read the ${SHEETS[k].label}.`};soon();writeDiag(k,{ok:false,code:"parse",message:String(e&&e.message||e).slice(0,300)})}
}
// keep the team copy small: undelivered/recent final-plan rows, last 62 days of job lines
function snapRows(k,rows){
  const cut=iso(new Date(today0()-62*DAY));
  if(k==="pdi")return rows.filter(p=>!p.deliveryDate||p.deliveryDate>=cut);
  if(k==="jobs"){const m1=new Date(today0());m1.setDate(1);m1.setMonth(m1.getMonth()-1);const c2=iso(m1);
    return rows.filter(j=>!j.assigned||j.assigned>=c2).map(j=>[j.jc,j.chassis,j.item,j.rate,j.labour,j.tech,j.status,j.assigned,j.supervisor])}
  if(k==="delivery")return rows.map(d=>({vin:d.vin,chassis:d.chassis,delivery:d.delivery}));
  return rows;
}
const diagSeen={};
async function writeDiag(k,d){
  if(!S.db||!S.canWrite)return;const key=JSON.stringify([d.ok,d.code,d.rows,d.b64]);if(diagSeen[k]===key)return;diagSeen[k]=key;
  try{await S.db.doc("diag/"+k).set({...d,file:S.files[k]||{id:SHEETS[k].id},at:new Date().toISOString()})}catch(e){}
}
function watchFile(k,id){
  if(watches[k]&&watches[k].id===id)return;
  if(watches[k])watches[k].off();
  S.src[k]={state:"loading"};
  const input=SHEETS[k].gsheet?{fileId:id,exportMimeType:"text/csv"}:{fileId:id};
  watches[k]={id,off:S.mcp.watchTool(SERVER,TOOL,input,ev=>onSheet(k,ev),{cache:{staleTime:60000,gcTime:3600000},refetchInterval:300000})};
}
function startWatches(){
  watchFile("delivery",SHEETS.delivery.id);
  let first=true;
  if(folderWatch)folderWatch();
  folderWatch=S.mcp.watchTool(SERVER,"search_files",{query:"parentId = '"+FOLDER+"' and trashed = false",orderBy:"modifiedTime desc",pageSize:50,excludeContentSnippets:true},ev=>{
    let files=[];
    if(ev.type==="data"){const pl=ev.result.payload;files=(pl&&pl.files)||[]}
    for(const k in SHEETS){if(SHEETS[k].gsheet)continue;
      const f=files.find(x=>SHEETS[k].match.test(x.title||""));
      if(f)S.files[k]={id:f.id,title:f.title,modifiedTime:f.modifiedTime,size:f.fileSize};
      // folder lookup failing still reads the known file
      if(f||first)watchFile(k,f?f.id:SHEETS[k].id);
    }
    first=false;soon();
  },{cache:{staleTime:60000,gcTime:3600000},refetchInterval:600000});
}
let folderWatch=null;
async function refreshAll(){if(S.standalone){if(S.server){ldTab="fresh data";ldUntil=Date.now()+900;fetchServer(true)}else fetchLinks();return}if(!S.mcp)return;ldTab="fresh data";ldUntil=Date.now()+900;setTimeout(updLoader,950);for(const k in SHEETS)S.src[k]={state:"loading"};render();
  try{await S.mcp.invalidate(SERVER)}catch(e){startWatches()}toast("Refreshing from Google Drive…")}

/* team snapshot in db so viewers without Drive see the latest read */
const saving={};
async function saveSnapshot(k,rows,h,at){
  if(!S.db||!S.canWrite||saving[k])return;
  if(S.snap[k]&&S.snap[k].hash===h)return;
  saving[k]=true;
  try{
    const parts=[];let cur=[],size=0;
    for(const r of rows){const s=JSON.stringify(r).length;if(size+s>180000){parts.push(cur);cur=[];size=0}cur.push(r);size+=s}
    parts.push(cur);
    for(let i=0;i<parts.length;i++)await S.db.doc("datasets/"+k+"-"+i).set({kind:k,part:i,parts:parts.length,rows:parts[i],hash:h,at});
    const old=S.snapDocs[k]||0;for(let i=parts.length;i<old;i++)await S.db.doc("datasets/"+k+"-"+i).delete();
  }catch(e){if(e&&e.code==="invalid_argument")S.canWrite=false}
  saving[k]=false;
}

};
function sheetCsvUrl(u){const m=String(u||"").match(/\/spreadsheets\/d\/([A-Za-z0-9_-]{20,})/);if(m&&!/\/d\/e\//.test(u)&&!/gviz|output=csv|format=csv/.test(u))return "https://docs.google.com/spreadsheets/d/"+m[1]+"/gviz/tq?tqx=out:csv";return u}
function ingest(k,aoa,at,h){
  const objs=toObjects(aoa);
  if(!objs.length){S.src[k]={state:"error",msg:`The ${SHEETS[k].label} has no rows.`};soon();return false}
  if(!SHEETS[k].need.every(x=>x in objs[0])){S.src[k]={state:"error",msg:`The ${SHEETS[k].label} is missing expected columns (${SHEETS[k].need.join(", ")}).`};soon();return false}
  const rows=objs.map(MAP[k]);
  S.live[k]={rows,at};S.src[k]={state:"live"};soon();
  saveSnapshot(k,snapRows(k,rows),h+":p4",at);
  return true;
}
function kindOf(name,aoa){
  const n=String(name||"");
  if(/deliver/i.test(n))return "delivery";
  for(const k in SHEETS)if(SHEETS[k].match&&SHEETS[k].match.test(n))return k;
  const o=toObjects(aoa.slice(0,30))[0]||{};
  for(const k of ["jobs","pdi","ibnd","delivery","stock"])if(SHEETS[k].need.every(x=>x in o)&&(k!=="delivery"||"delivery" in o))return k;
  return "";
}
async function readUpload(file){
  const buf=await file.arrayBuffer();
  if(/\.csv$/i.test(file.name))return parseCSV(new TextDecoder().decode(buf));
  if(!window.XLSX)throw new Error("Excel reader didn't load. Check the internet connection.");
  const wb=XLSX.read(new Uint8Array(buf),{type:"array",cellDates:false,dense:true});
  return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:""});
}
async function uploadFiles(files){
  ldTab="your reports";ldUntil=Date.now()+60000;updLoader();
  const done=[],bad=[];
  for(const f of files){
    try{$("#ldTitle").textContent="Reading "+f.name;await new Promise(r=>setTimeout(r,30));
      const aoa=await readUpload(f);const k=kindOf(f.name,aoa);
      if(!k){bad.push(f.name+" (report type not recognised)");continue}
      if(ingest(k,aoa,f.lastModified||Date.now(),hash(f.name+f.size+f.lastModified))){S.files[k]={title:f.name,modifiedTime:new Date(f.lastModified||Date.now()).toISOString()};done.push(SHEETS[k].label)}
      else bad.push(f.name+" ("+(S.src[k].msg||"not read")+")");
    }catch(e){bad.push(f.name+" ("+(e&&e.message||"not read")+")")}
  }
  ldUntil=0;render();
  toast(done.length?`Loaded: ${done.join(", ")}`+(bad.length?` · skipped ${bad.length}`:""):"No report could be read");
  if(bad.length){const el=$("#upMsg");if(el)el.innerHTML=bad.map(b=>`<div class="chip bad" style="white-space:normal">${esc(b)}</div>`).join(" ")}
}
async function fetchLinks(){
  const ks=Object.keys(LINKS).filter(k=>LINKS[k]);
  for(const k of ks)if(!S.live[k])S.src[k]={state:"loading"};render();
  await Promise.all(ks.map(async k=>{
    try{const r=await fetch(sheetCsvUrl(LINKS[k]),{cache:"no-store"});if(!r.ok)throw new Error("HTTP "+r.status);
      const t=await r.text();if(/^\s*<(!doctype|html)/i.test(t))throw new Error("not public");
      ingest(k,parseCSV(t),Date.now(),hash(t.slice(0,200000))+t.length);
    }catch(e){if(!S.live[k])S.src[k]={state:"error",msg:`Couldn't open the ${SHEETS[k].label} link. Share the sheet as "Anyone with the link can view", or load the file on the Data tab.`};soon()}
  }));
}
/* tiny local database with the same calls the page uses (doc/collection/onSnapshot), kept in IndexedDB */
function localDb(){
  const mem=new Map(),subs={};let idb=null;
  const open=()=>new Promise(res=>{try{const r=indexedDB.open("am-pdi-yard",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>res(r.result);r.onerror=()=>res(null)}catch(e){res(null)}});
  const tx=(mode,fn)=>{if(!idb)return;try{const t=idb.transaction("kv",mode);fn(t.objectStore("kv"))}catch(e){}};
  const col=p=>p.split("/")[0];
  const snap=c=>({docs:[...mem.entries()].filter(([k])=>col(k)===c).map(([k,v])=>({id:k.slice(c.length+1),exists:true,data:()=>v}))});
  const notify=c=>(subs[c]||[]).forEach(cb=>{try{cb(snap(c))}catch(e){}});
  const ready=(async()=>{idb=await open();if(!idb)return;await new Promise(res=>{try{const t=idb.transaction("kv","readonly");const st=t.objectStore("kv");const rq=st.openCursor();rq.onsuccess=()=>{const c=rq.result;if(c){mem.set(c.key,c.value);c.continue()}else res()};rq.onerror=()=>res()}catch(e){res()}})})();
  const doc=path=>({
    set:async d=>{await ready;const v=JSON.parse(JSON.stringify(d));mem.set(path,v);tx("readwrite",st=>st.put(v,path));notify(col(path))},
    update:async d=>{await ready;const v=Object.assign({},mem.get(path)||{},JSON.parse(JSON.stringify(d)));mem.set(path,v);tx("readwrite",st=>st.put(v,path));notify(col(path))},
    get:async()=>{await ready;const v=mem.get(path);return {exists:v!==undefined,id:path.split("/").pop(),data:()=>v}},
    delete:async()=>{await ready;mem.delete(path);tx("readwrite",st=>st.delete(path));notify(col(path))}
  });
  return {ready,doc,
    collection:c=>({
      add:async d=>{const id=Date.now().toString(36)+Math.random().toString(36).slice(2,8);await doc(c+"/"+id).set(d);return {id}},
      get:async()=>{await ready;return snap(c)},
      onSnapshot:(cb)=>{(subs[c]=subs[c]||[]).push(cb);ready.then(()=>cb(snap(c)));return ()=>{subs[c]=subs[c].filter(x=>x!==cb)}}
    })};
}
/* Website server (Cloudflare _worker.js): reads the PDI Drive folder with a Google service account.
   Each report is downloaded only when its Drive file changed; otherwise the copy kept in this browser is used. */
const DELIVERY_ID="1Kpi75PeN2jeh_8PzsgmlPcyrf85v7s7VV3Q4HrnMwZU";
async function fetchServer(force){
  let list;
  try{const r=await fetch("/api/drive?list=1",{cache:"no-store"});
    const j=await r.json().catch(()=>null);
    if(!r.ok||!j||!j.files){S.serverMsg=r.status===404||!j?"":(j.message||j.error||("Server error "+r.status));return false}
    list=j.files}catch(e){return false}
  S.server=true;S.serverMsg="";
  const pickFor=k=>k==="delivery"?list.find(f=>f.id===DELIVERY_ID||/deliver/i.test(f.name||"")):list.find(f=>SHEETS[k].match&&SHEETS[k].match.test(f.name||""));
  const jobs=Object.keys(SHEETS).map(async k=>{
    const f=pickFor(k);
    if(!f){if(!hasData(k))S.src[k]={state:"error",msg:`No ${SHEETS[k].label} found in the Drive folder.`};soon();return}
    S.files[k]={id:f.id,title:f.name,modifiedTime:f.modifiedTime,size:f.size};
    const stamp=f.id+"|"+f.modifiedTime;
    if(!force&&ls("pdi.file."+k)===stamp&&(S.snap[k]||S.live[k])){S.src[k]={state:"live"};soon();return}
    S.src[k]={state:"loading"};soon();
    try{
      const r=await fetch("/api/drive?id="+encodeURIComponent(f.id),{cache:"no-store"});
      if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error(j.message||j.error||("HTTP "+r.status))}
      const ct=r.headers.get("content-type")||"";const buf=await r.arrayBuffer();
      let aoa;
      if(/csv|text/.test(ct))aoa=parseCSV(new TextDecoder().decode(buf));
      else{if(!window.XLSX)throw new Error("Excel reader didn't load");const wb=XLSX.read(new Uint8Array(buf),{type:"array",cellDates:false,dense:true});aoa=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:""})}
      if(ingest(k,aoa,Date.parse(f.modifiedTime)||Date.now(),hash(stamp)))ls("pdi.file."+k,stamp);
    }catch(e){S.src[k]={state:"error",msg:`Couldn't read the ${SHEETS[k].label} from Drive (${String(e&&e.message||e).slice(0,120)}).`};soon()}
  });
  await Promise.all(jobs);render();return true;
}
async function standalone(){
  S.standalone=true;
  for(const k in SHEETS)S.src[k]={state:"loading"};
  $("#liveTxt").textContent="This browser";$("#live").classList.remove("off");
  const db=localDb();S.db=db;S.canWrite=true;
  render();
  db.collection("datasets").onSnapshot(snap=>{
    const by={};for(const d of snap.docs){const x=d.data();if(x&&x.kind)(by[x.kind]=by[x.kind]||[]).push(x)}
    S.snapDocs={};
    for(const k in by){const ps=by[k].sort((a,b)=>a.part-b.part);S.snapDocs[k]=ps.length;
      const n=ps[0].parts||ps.length;const h=ps[0].hash;const use=ps.filter(p=>p.hash===h).slice(0,n);
      if(use.length===n){let rows=use.flatMap(p=>p.rows||[]);
        if(k==="jobs"&&Array.isArray(rows[0]))rows=rows.map(a=>({jc:a[0],chassis:a[1],item:a[2],rate:a[3],labour:a[4],tech:a[5],status:a[6],assigned:a[7],supervisor:a[8],customer:"",model:"",branch:"",workDate:""}));
        S.snap[k]={rows,at:ps[0].at,hash:h}}}
    soon();
  });
  db.collection("handover").onSnapshot(snap=>{const H={};for(const d of snap.docs)H[d.id]=d.data();S.handover=H;if(S.tab==="handover"||S.tab==="overview")soon()});
  await db.ready;
  if(await fetchServer()){setInterval(()=>fetchServer(),600000);return}
  for(const k in SHEETS)if(!LINKS[k]&&!S.live[k])S.src[k]={state:"error",msg:"Load this report on the Data tab."};
  render();
  fetchLinks();
}

(async function connect(){
  const C=window.claude;
  if(!C||!C.use){standalone();return}
  const safe=p=>Promise.resolve(p).catch(()=>null);
  const [db,user,assets,mcp]=await Promise.all([safe(C.use("db")),safe(C.use("user")),safe(C.use("assets")),safe(C.use("mcp"))]);
  S.db=db;S.user=user;S.assets=assets;S.mcp=mcp;
  if(user){try{S.uid=await user.id()}catch(e){}try{const c=await user.can("data.write");if(c===false)S.canWrite=false}catch(e){}}
  if(mcp){startWatches();$("#live").classList.remove("off");$("#liveTxt").textContent="Live"}
  else{for(const k in SHEETS)S.src[k]={state:"error",msg:"Live sheets can't be read in this view."};$("#liveTxt").textContent=db?"Saved copy":"Offline"}
  render();
  if(!db)return;
  db.collection("datasets").onSnapshot(snap=>{
    const by={};for(const d of snap.docs){const x=d.data();if(x&&x.kind)(by[x.kind]=by[x.kind]||[]).push(x)}
    S.snapDocs={};
    for(const k in by){const ps=by[k].sort((a,b)=>a.part-b.part);S.snapDocs[k]=ps.length;
      if(k==="hsrp"){S.hsrp=ps[0].rows||[];S.hsrpMeta={at:ps[0].at,file:ps[0].file};continue}
      const n=ps[0].parts||ps.length;const h=ps[0].hash;const use=ps.filter(p=>p.hash===h).slice(0,n);
      if(use.length===n){let rows=use.flatMap(p=>p.rows||[]);
        if(k==="jobs"&&Array.isArray(rows[0]))rows=rows.map(a=>({jc:a[0],chassis:a[1],item:a[2],rate:a[3],labour:a[4],tech:a[5],status:a[6],assigned:a[7],supervisor:a[8],customer:"",model:"",branch:"",workDate:""}));
        S.snap[k]={rows,at:ps[0].at,hash:h}}}
    soon();
  },()=>{});
  db.collection("handover").onSnapshot(async snap=>{
    const H={},ids=new Set();for(const d of snap.docs){H[d.id]=d.data();if(H[d.id].updatedBy)ids.add(H[d.id].updatedBy)}
    S.handover=H;
    if(user&&ids.size){try{const ps=await user.profiles([...ids]);for(const id of ids)S.names[id]=(ps[id]&&ps[id].name)||"a teammate"}catch(e){}}
    if(S.tab==="handover"||S.tab==="overview")soon();
  },()=>{});
})();
})();
